l_english:
 # Artefatos unicos dos fundadores (marco 6, fase 6c). Texto criado pelo Claude e contado ao autor.
 ci_relic_lux_omnissiae_name:0 "Lux Omnissiae"
 ci_relic_lux_omnissiae_desc:0 "The blade the Omnissiah carried down from the Temple Mount. Its steel holds the light of the sun even in darkness, and those who have faced it say it is less a sword than a sentence."
 ci_relic_baculum_undomiel_name:0 "Baculum Undómiel"
 ci_relic_baculum_undomiel_desc:0 "The staff of Helaena Undómiel, mother of the Sanguinis. She leaned on it when she walked among the sick, and the sisters of Undómiel swear that no one who touched it died of fever that year."
 ci_relic_aeterna_name:0 "Aeterna"
 ci_relic_aeterna_desc:0 "Reid Astrea's sword, never drawn against a fleeing enemy nor sheathed while a companion still stood in danger. Its name was the first word of his house's motto: Lux Aeterna Regnat."
 ci_relic_lamina_occulta_name:0 "Lamina Occulta"
 ci_relic_lamina_occulta_desc:0 "A slender blade worn beneath the sleeve, invisible until it is too late. Ezio Auditore held that a single knife in the right place could spare a thousand lives on a battlefield."
 ci_relic_sigillum_emreis_name:0 "Sigillum Emreis"
 ci_relic_sigillum_emreis_desc:0 "The seal with which Emhyr Emreis signed the first laws, levies and road charters of the Imperium. Where his seal went, granaries and governors followed."
 ci_relic_primus_codex_name:0 "Primus Codex"
 ci_relic_primus_codex_desc:0 "The first written copy of the words of the Omnissiah, set down by Vistários Granhiéron so that no later age could twist them. Veritas and Lex alike call it the root of every Codex."
 ci_relic_lorica_martyris_name:0 "Lorica Martyris"
 ci_relic_lorica_martyris_desc:0 "Le'garde Martyr's armour, dented by a hundred blows he chose to take in place of others. He held that order and faith are one, and that both are paid for in blood."
 ci_relic_gladius_ultramar_name:0 "Gladius Ultramar"
 ci_relic_gladius_ultramar_desc:0 "The sword of Hrodric Gyliman, who taught the Legio that a blade is only as sharp as the supply line behind it. Gladius et Mens Unum is engraved along its fuller."
 ci_relic_hasta_orientis_name:0 "Hasta Orientis"
 ci_relic_hasta_orientis_desc:0 "Verso Lumere's spear, always the first to reach the enemy line. He never let a foe choose the hour or the field, and the spear was always pointed east, towards the dawn."
 ci_relic_pomum_rationis_name:0 "Pomum Rationis"
 ci_relic_pomum_rationis_desc:0 "A small golden sphere in a carved case that Altaïr Ramashiri carried everywhere. He would turn it in his fingers while arguing, and claimed it reminded him that no honest question can break a true god."
 ci_relic_drakenfyr_name:0 "Drakenfyr"
 ci_relic_drakenfyr_desc:0 "The great axe that gave its name to Sigvardr's house. It was swung in anger more often than in counsel, but never once against a man to whom Sigvardr had given his word."
 ci_relic_niten_name:0 "Niten"
 ci_relic_niten_desc:0 "The pair of blades of Miyamoto Musashi, the long and the short, wielded together as one. He studied every opponent as a scholar studies a text, and none of them ever finished the reading."
 ci_relic_galea_solis_name:0 "Galea Solis"
 ci_relic_galea_solis_desc:0 "A sun-crowned helm worn by Aurelian Solerius, who planned whole campaigns around a single fortress. It was said that walls grew tired just from seeing it on the horizon."
 ci_relic_anulus_concordiae_name:0 "Anulus Concordiae"
 ci_relic_anulus_concordiae_desc:0 "Lakan Shaokan's signet ring, pressed into the wax of a hundred bargains. Coin, secrets and favours all passed beneath it, and every one of them served the Imperium."
 ci_relic_arcus_viriati_name:0 "Arcus Viriati"
 ci_relic_arcus_viriati_desc:0 "The bow of Astarinus Viriata, who taught small bands to bleed great armies among the hills and the trees. Its arrows came from nowhere and left no one to follow them home."
 ci_relic_lorica_fidei_name:0 "Lorica Fidei"
 ci_relic_lorica_fidei_desc:0 "Julius Euclius's mail, never stained with the blood of a prisoner or a peasant. Fides Ante Gloriam: his soldiers would follow it anywhere, because it never led them anywhere shameful."
 ci_relic_flagellum_stellarum_name:0 "Flagellum Stellarum"
 ci_relic_flagellum_stellarum_desc:0 "Radahn's enormous hammer, which it took two ordinary men to lift. The soldiers swore he once struck the sky with it and a star fell; Radahn never denied it, and always shared the spoils."
 ci_relic_pugio_deserti_name:0 "Pugio Deserti"
 ci_relic_pugio_deserti_desc:0 "A curved, milk-white blade that Alia Arrakina never explained and never let anyone else hold. Those who saw it drawn said it seemed less forged than grown, and that once drawn it was never sheathed clean."
 ci_relic_flamma_occidentis_name:0 "Flamma Occidentis"
 ci_relic_flamma_occidentis_desc:0 "The long sword of Elessar Telcontar, reforged from a broken blade of his fathers. He drew it rarely; by the time it left the scabbard, the war had usually been won in silence."
