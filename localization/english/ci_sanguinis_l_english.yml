l_english:

 # Cura dos Sanguinis, Legado Sanguinis e espadas de fogo (marco 4, fase 4e). Texto aprovado pelo autor em 10/10/2026 (docs, Lore para revisao, 4e.4).

 # Nome do grupo de tracos sanguini_1 a sanguini_5 (marco 5, fase 5a; o vanilla usa a chave trait_<grupo>, ex.: trait_beauty_good)
 trait_sanguini:0 "Sanguinis"

 # Interacao
 ci_sanguinis_healing_interaction:0 "Healing of the Blood"
 ci_sanguinis_healing_interaction_desc:0 "The blood of the Omnissiah runs in my veins. Let it burn away the sickness that consumes [recipient.GetShortUIName], though it costs me dearly."
 ci_sanguinis_healing_interaction_actor_toast:0 "Healing of the Blood"
 ci_sanguinis_healing_interaction_recipient_toast:0 "Healed by the Blood"
 ci_sanguinis_healing_interaction_recipient_toast_desc:0 "[actor.GetTitledFirstName] laid hands upon me, and the sickness fled before the light of the divine blood."
 ci_sanguinis_healing_no_illness_tt:0 "[recipient.GetShortUIName] has no sickness to heal"

 # Desgaste de quem cura (tres intensidades, mesmo texto)
 ci_sanguinis_spent_blood:0 "Spent Blood"
 ci_sanguinis_spent_blood_desc:0 "Healing another has drawn deeply upon the divine blood in my veins."
 ci_sanguinis_spent_blood_075:0 "$ci_sanguinis_spent_blood$"
 ci_sanguinis_spent_blood_075_desc:0 "$ci_sanguinis_spent_blood_desc$"
 ci_sanguinis_spent_blood_050:0 "$ci_sanguinis_spent_blood$"
 ci_sanguinis_spent_blood_050_desc:0 "$ci_sanguinis_spent_blood_desc$"
 ci_sanguinis_spent_blood_025:0 "$ci_sanguinis_spent_blood$"
 ci_sanguinis_spent_blood_025_desc:0 "$ci_sanguinis_spent_blood_desc$"

 # Opiniao do curado
 ci_sanguinis_healed_opinion:0 "Healed by the Sanguinis"

 # Legado
 ci_sanguinis_legacy_track_name:0 "Sanguinis"
 ci_sanguinis_legacy_track_desc:0 "The blood of the Omnissiah flows in our veins, and each generation learns anew to wield it."
 ci_sanguinis_legacy_1_name:0 "Vigor Sanguinis"
 ci_sanguinis_legacy_2_name:0 "Dona Omnissiae"
 ci_sanguinis_legacy_3_name:0 "Misericordia Sanguinis"
 ci_sanguinis_legacy_3_effect_desc:0 "#V $ci_sanguinis_healing_interaction$#! wears less on the healer: #N -0.5#! [health|E] at Sanguinis level 4 and #N -0.25#! at level 5, instead of -0.75 and -0.5"
 ci_sanguinis_legacy_4_name:0 "Stirps Divina"
 ci_sanguinis_legacy_5_name:0 "Gladii Ignis"
 ci_sanguinis_legacy_5_effect_desc:0 "Can recruit the #V $ci_sanguinis_fire_swords$#! [men_at_arms|E]"

 # Espadas de fogo
 ci_sanguinis_fire_swords:0 "Fire Swords"
 ci_sanguinis_fire_swords_flavor:0 "#F Chosen warriors sworn to the blood of the Omnissiah. In the old songs of the Legio, their blades burned with His light; on the field, men swear they still do.#!"
