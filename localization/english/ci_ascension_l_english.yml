l_english:

 # Ascension (milestone 2, phase c)
 death_ascended:0 "Ascended to Godhood"

 ci_ascension_decision:0 "Ascendit ad Divinitatem"
 ci_ascension_decision_desc:0 "When the divine blood of the Sanguinis has endured through a lifetime of earthly rule, the heavens may call its bearer home. Only one who has proven worthy through age, piety, renown, and dominion over the Empire of Italy may answer: to surrender the mortal crown, pass the realm to an heir, and ascend to dwell among the divine."
 ci_ascension_decision_tooltip:0 "Answer the heavens' call and ascend to godhood"
 ci_ascension_decision_confirm:0 "Begin the sacred ascent"
 ci_ascension_decision_effect_tt:0 "You will ascend and die; your heir will inherit as usual, and your dynasty will gain #V 1500#! prestige. Your heirs may later venerate you and choose your place of rest. Once you embrace the Ascension, it cannot be undone."

 ci_ascension.0001.t:0 "The Final Ascent"
 ci_ascension.0001.desc:0 "The hour has come. Beyond the veil of the mortal world, the heavens call to the divine blood within you. Your crown, your kingdom, and your mortal shell must all be surrendered; your heir shall take up the burden of rule in your stead. The path before you leads from earthly dominion to the company of the divine. Will you answer?"
 ci_ascension.0001.a:0 "I surrender my mortal crown and ascend."
 ci_ascension.0001.b:0 "The hour is not yet come."

 # The faithful learn of an ascension
 ci_ascension.0002.t:0 "A Soul Rises to the Divine"
 ci_ascension.0002.desc:0 "The faithful bear witness to a soul departing the mortal world. One who carried the purest blood of the Sanguinis has laid down crown and life, and the heavens have received them. The throne passes to an heir, but the ascendant's name now shines before the faithful as a sign of the divine beyond mortal reach."
 ci_ascension.0002.a:0 "May the heavens receive the ascendant."
 ci_fervor_gain_ascension:0 "The Ascension of a Sanguinis"