l_english:

 # Decisao que funda o Adeptus Ministorum (k_sol). Texto do autor.
 ci_found_ministorum_decision:0 "Found the Adeptus Ministorum"
 ci_found_ministorum_decision_desc:0 "With Italy under the Imperialis banner, the faith may establish a lasting seat of spiritual authority. Let the Adeptus Ministorum guard the sacred rites and teachings of the Imperium, and let Helaena Undómiel serve as its first head."
 ci_found_ministorum_decision_tooltip:0 "Establish the spiritual head of the Imperialis faith"
 ci_found_ministorum_decision_confirm:0 "Found the Ministorum"
 ci_found_ministorum_decision_effect_tooltip:0 "The #V Adeptus Ministorum#! title is created and its holder becomes Head of Faith. Helaena Undómiel will hold the title if she is alive, an adult, and of the faith; otherwise, it passes to the eligible adult follower in your court or among your direct vassals with the highest combined Learning and piety level. The Head of Faith leads the Cultus Imperialis rite."
 ci_found_ministorum_holder_exists_tt:0 "Helaena Undómiel, or an eligible adult follower of the faith in your court or among your direct vassals, can hold the title"