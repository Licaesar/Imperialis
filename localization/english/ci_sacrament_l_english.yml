l_english:

 # Sacramentos do Imperialis (marco 4, fase 4d). Texto aprovado pelo autor em 10/10/2026 (docs, Lore para revisao, 4d.2).
 # Gerado por docs/dev/regen_sacrament_decisions.py a partir da localizacao vanilla; as chaves sem troca repetem o texto vanilla.
 ci_pam_cardinal_endow_masses_decision:0 "Endow Liturgies"
 ci_pam_cardinal_endow_masses_decision_confirm:0 "Seal the endowment"
 ci_pam_cardinal_endow_masses_decision_desc:0 "The benefices of my office arrive with dull regularity, and what is not spent must still be accounted for.\n\nLet it be settled upon chantries, so that the [ROOT.Char.GetFaith.PriestNeuterPlural] are paid to chant the [ROOT.Char.GetFaith.ReligiousText] for the dead in perpetuity. The endowment will be recorded, sealed, and read out in every [ROOT.Char.GetFaith.HouseOfWorship] under my care."
 ci_pam_cardinal_endow_masses_decision_subordinates_tt:0 "Your [subordinate|E] [clergy|E] gain [piety|E] and [opinion|E] of you"
 ci_pam_cardinal_endow_masses_decision_toast:0 "Endowed Liturgies"
 ci_pam_cardinal_endow_masses_decision_tooltip:0 "Spend [treasury|E] to gain [piety|E]. Your [subordinate|E] [clergy|E] gain [piety|E] and [opinion|E] of you"
 ci_pam_cardinal_endowed_masses_opinion:0 "Endowed Liturgies"
 ci_pam_decision_act_of_devotion:0 "Stage an Act of Devotion"
 ci_pam_decision_act_of_devotion_confirm:0 "Make the bells toll!"
 ci_pam_decision_act_of_devotion_desc:0 "My profound internal connection with [ROOT.Char.GetFaith.HighGodName] is so strong, I must externalize it!\n\nSummon the [ROOT.Char.GetFaith.PriestNeuterPlural], perform a great liturgy, call for everyone in the realm. Let them see how devoted their liege is."
 ci_pam_decision_act_of_devotion_desc_tooltip:0 "Exchange [piety|E] for [prestige|E]"
 ci_pam_decision_act_of_devotion_fame_tooltip:0 "Your [prestige_level|E] must be below [GetModifier( 'prestige_level_3' ).GetNameWithTooltip|L]"
 ci_pam_decision_act_of_devotion_sp_tooltip:0 "Your [spiritual_fulfillment|E] is at least #V [EmptyScope.ScriptValue('spiritual_fulfillment_2')|0]#!"
 ci_pam_decision_act_of_devotion_tooltip_effect:0 "You will choose between:\n$BULLET_WITH_TAB$ [prestige_i]#P [EmptyScope.ScriptValue('major_prestige_gain')|0]#! [prestige|E]\n$BULLET_WITH_TAB$ [prestige_i]#P [EmptyScope.ScriptValue('medium_prestige_gain')|0]#! [prestige|E] and an extra [prestige_level|E] in exchange for a [piety_level|E]"
 ci_pam_decision_confession_confirm:0 "Summon the [ROOT.Char.GetFaith.PriestNeuter]"
 ci_pam_decision_confession_desc:0 "When a [ROOT.Char.GetWomanMan] becomes aware of the guilt [ROOT.Char.GetSheHe] carries, [ROOT.Char.GetSheHe] must confess [ROOT.Char.GetHerHis] sins."
 ci_pam_decision_confession_name:0 "Take Confession"
 ci_pam_decision_confession_name_low:0 "Confess My Sins"
 ci_pam_decision_confession_sp_court_chaplain:0 "You are employing a [court_chaplain|E]"
 ci_pam_decision_confession_tooltip:0 "Confess your sins"
 ci_pam_decision_confession_tooltip_sp_effect:0 "You will gain some [spiritual_fulfillment|E]"
 ci_pam_decision_confession_tooltip_stress_effect:0 "You will lose some [stress|E]"
 ci_pam_decision_events.0001.a:0 "Forgive me, [chaplain.GetMotherFather], for I have sinned."
 ci_pam_decision_events.0001.a.confession_random_outcome:0 "Your [court_chaplain|E] may ask something of you, or you may hear something during the confession..."
 ci_pam_decision_events.0001.a.conversion:0 "[chaplain.GetShortUIName] asks you to convert [target.GetShortUIName]"
 ci_pam_decision_events.0001.a.conversion.toast:0 "You fulfilled your promise"
 ci_pam_decision_events.0001.a.conversion.toast_puppeteer:0 "[puppet_or_actor.GetShortUIName] fulfilled their promise"
 ci_pam_decision_events.0001.a.courtier_secret:0 "You hear [my_courtier.GetShortUIName] taking confession"
 ci_pam_decision_events.0001.a.high_almoner:0 "[chaplain.GetShortUIName] asks you hire a [GetCourtPositionType('high_almoner_court_position').GetName()]"
 ci_pam_decision_events.0001.a.hook:0 "[chaplain.GetShortUIName] learned of some new information"
 ci_pam_decision_events.0001.a.no_war:0 "[chaplain.GetShortUIName] asks you to not declare any offensive wars in #V 5 years#!"
 ci_pam_decision_events.0001.a.opinion_malus:0 "[chaplain.GetShortUIName] disapproves of your sinful traits"
 ci_pam_decision_events.0001.a.piety:0 "Your confession felt sincere"
 ci_pam_decision_events.0001.a.pilgrimage:0 "[chaplain.GetShortUIName] asks you to go on a [pilgrimage|E]"
 ci_pam_decision_events.0001.a.random_confession:0 "You hear someone else taking confession"
 ci_pam_decision_events.0001.desc.bad:0 "[chaplain.GetHerHis|U] stern look mimics the one I expect from the Father."
 ci_pam_decision_events.0001.desc.good:0 "Even if the weight over my shoulders is not heavy, it can still be lightened."
 ci_pam_decision_events.0001.desc.intro:0 "[chaplain.GetTitledFirstName] waits patiently in the empty chapel.\n\n"
 ci_pam_decision_events.0001.desc.neutral:0 "Lost like a piece of cattle, unsure of the goodness of my heart, I approach [chaplain.GetHerHim]."
 ci_pam_decision_events.0001.desc.outro:0 "\n\n"What is laid bare before the [ROOT.Char.GetFaith.HighGodName] is lifted from the soul." #weak — the [ROOT.Char.GetFaith.ReligiousText]#!"
 ci_pam_decision_events.0001.desc.sin.ambitious:0 "Ambition has outrun my conscience."
 ci_pam_decision_events.0001.desc.sin.arbitrary:0 "I have ruled by whim rather than justice."
 ci_pam_decision_events.0001.desc.sin.arrogant:0 "Pride has swollen my heart."
 ci_pam_decision_events.0001.desc.sin.brave:0 "My boldness has outrun prudence and become recklessness."
 ci_pam_decision_events.0001.desc.sin.callous:0 "I have hardened my heart to the suffering of others."
 ci_pam_decision_events.0001.desc.sin.calm:0 "My calm has been indifference dressed as virtue."
 ci_pam_decision_events.0001.desc.sin.chaste:0 "My chastity has become a cold refuge from duty."
 ci_pam_decision_events.0001.desc.sin.compassionate:0 "Pity has led me to excuse what should be condemned."
 ci_pam_decision_events.0001.desc.sin.content:0 "Contentment has dulled my hunger for righteousness."
 ci_pam_decision_events.0001.desc.sin.craven:0 "Fear has led me to forsake what was right."
 ci_pam_decision_events.0001.desc.sin.cynical:0 "Cynicism has corroded my faith."
 ci_pam_decision_events.0001.desc.sin.deceitful:0 "I have spoken falsehoods and concealed what I owed in honesty."
 ci_pam_decision_events.0001.desc.sin.diligent:0 "My zeal for labor has crowded out mercy."
 ci_pam_decision_events.0001.desc.sin.eccentric:0 "My eccentric ways have scandalized the faithful."
 ci_pam_decision_events.0001.desc.sin.fickle:0 "Inconstancy has made my word unreliable."
 ci_pam_decision_events.0001.desc.sin.forgiving:0 "Forgiveness has come too easily to grave offenses."
 ci_pam_decision_events.0001.desc.sin.generous:0 "My giving has outrun wisdom and left me emptied."
 ci_pam_decision_events.0001.desc.sin.gluttonous:0 "I have fed the flesh beyond restraint."
 ci_pam_decision_events.0001.desc.sin.greedy:0 "I have clung to gold when I should have given."
 ci_pam_decision_events.0001.desc.sin.gregarious:0 "My love of company has drowned out conscience."
 ci_pam_decision_events.0001.desc.sin.honest:0 "My blunt honesty has wounded where gentleness was due."
 ci_pam_decision_events.0001.desc.sin.humble:0 "False humility has kept me from truth."
 ci_pam_decision_events.0001.desc.sin.impatient:0 "Impatience has made me harsh and rash."
 ci_pam_decision_events.0001.desc.sin.just:0 "My justice has been merciless and proud."
 ci_pam_decision_events.0001.desc.sin.lazy:0 "Sloth has kept me from prayer and duty."
 ci_pam_decision_events.0001.desc.sin.lustful:0 "I have let lust master my will."
 ci_pam_decision_events.0001.desc.sin.paranoid:0 "Suspicion has poisoned my dealings with others."
 ci_pam_decision_events.0001.desc.sin.patient:0 "Patience has curdled into cowardly delay."
 ci_pam_decision_events.0001.desc.sin.preamble:0 "\n\nThe guilt I feel from my sins is no stranger to me."
 ci_pam_decision_events.0001.desc.sin.sadistic:0 "I have taken pleasure in cruelty."
 ci_pam_decision_events.0001.desc.sin.shy:0 "Timidity has kept me from the good I should have done."
 ci_pam_decision_events.0001.desc.sin.stubborn:0 "Stubbornness has made me deaf to correction."
 ci_pam_decision_events.0001.desc.sin.temperate:0 "My temperance has hardened into denial of need."
 ci_pam_decision_events.0001.desc.sin.trusting:0 "Trust has made me blind to wickedness."
 ci_pam_decision_events.0001.desc.sin.vengeful:0 "Vengeance has consumed me."
 ci_pam_decision_events.0001.desc.sin.wrathful:0 "Anger has driven me to sin."
 ci_pam_decision_events.0001.desc.sin.zealous:0 "Zeal has burned hotter than charity."
 ci_pam_decision_events.0001.t:0 "Confession"
 ci_pam_decision_events.0002.a:0 "I must address the crowd myself."
 ci_pam_decision_events.0002.b:0 "A simple acknowledgement will suffice."
 ci_pam_decision_events.0002.desc.bad:0 "as I struggle to pay attention."
 ci_pam_decision_events.0002.desc.crowned:0 "my crown like a halo."
 ci_pam_decision_events.0002.desc.good:0 "as the audience seems to be solely focused on me."
 ci_pam_decision_events.0002.desc.intro:0 "[my_chaplain.GetTitledFirstName] stands next to me, next to the altar. The soft rays of sun illuminate"
 ci_pam_decision_events.0002.desc.mid:0 "\n\n"...and the [ROOT.Char.GetFaith.HighGodName] walked among us, that we might walk in His light..." [my_chaplain.GetHerHis|U] sermon goes on and on"
 ci_pam_decision_events.0002.desc.neutral:0 "as I peruse the audience to find impressed faces."
 ci_pam_decision_events.0002.desc.outro:0 "\n\n"And our [ROOT.Char.GetNameNoTooltip], wise and virtuous, will lead us in this doomed time.""
 ci_pam_decision_events.0002.desc.uncrowned:0 "my clothes like a holy mantle."
 ci_pam_decision_events.0002.t:0 "A Show of Devotion"
 ci_pam_decision_events.0003.a:0 "A rotten [ROOT.Char.GetTitleAsNameNoTooltip|l] will soon poison [target_child.GetHerHis] [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l]."
 ci_pam_decision_events.0003.after_tt:0 "Something may be revealed about [target_child.GetFirstName]..."
 ci_pam_decision_events.0003.b:0 "Just... Be good."
 ci_pam_decision_events.0003.desc.bad:0 "[target_child.GetHerHis|U] sunken face, uninterested stare, almost asleep.\n\n"[ROOT.Char.GetMotherFather|U]," [target_child.GetSheHe] asks impatiently, "why have you made me call?""
 ci_pam_decision_events.0003.desc.good:0 "[target_child.GetHerHis|U] eyes made bright by the candlelight. [target_child.GetSheHe|U] is a good [target_child.GetWomanMan].\n\n"[ROOT.Char.GetMotherFather|U]," [target_child.GetSheHe] asks, "have I wronged you?""
 ci_pam_decision_events.0003.desc.intro:0 "Night has fallen, and the keep is still. My [target_child.Custom('GetDaughterSon')] sits beside me in the private chapel.\n\nI take a look at [target_child.GetHerHim]."
 ci_pam_decision_events.0003.desc.neutral:0 "[target_child.Custom('ComplimentAdjective')|U]. Old enough now.\n\n"[ROOT.Char.GetMotherFather|U]," [target_child.GetSheHe] asks softly, "how does one live rightly?""
 ci_pam_decision_events.0003.education:0 "[target_child.GetShortUIName] improves [target_child.GetHerHis] education"
 ci_pam_decision_events.0003.learning:0 "[target_child.GetShortUIName] improves [target_child.GetHerHis] knowledge"
 ci_pam_decision_events.0003.lover:0 "[target_child.GetShortUIName] breaks up with [lover_scope.GetShortUIName]"
 ci_pam_decision_events.0003.mystic:0 "[target_child.GetShortUIName] takes a strong interest in the matter"
 ci_pam_decision_events.0003.secret:0 "[target_child.GetShortUIName] confesses to you"
 ci_pam_decision_events.0003.stress:0 "[target_child.GetShortUIName] has a crisis"
 ci_pam_decision_events.0003.t:0 "The Most Important Lesson"
 ci_pam_decision_events.0003.trait:0 "[target_child.GetShortUIName] has a moment of revelation"
 ci_pam_decision_events.0005.a:0 "The sacrament of penance lies ahead."
 ci_pam_decision_events.0005.b:0 "The [ROOT.Char.GetFaith.DevilName] take me! Rid me of this priest."
 ci_pam_decision_events.0005.desc.alone:0 "I tremble with fright, alone, no loved ones close at hand to pray for my soul."
 ci_pam_decision_events.0005.desc.bad:0 "I have struggled to honor [ROOT.Char.GetFaith.HighGodName], and in my arrogance have tried to hide my sin from his all-seeing eyes.\n\n"
 ci_pam_decision_events.0005.desc.good:0 "Mercifully, I feel as though the Venerated Ancestors are close at hand, guarding my soul from the servants of the [ROOT.Char.GetFaith.DevilName], who would hope to claim it.\n\n"
 ci_pam_decision_events.0005.desc.healthtrait:0 "Sin has made me [death_trait.GetName(soon_dead)|l] and is likely the cause of my imminent death."
 ci_pam_decision_events.0005.desc.neutral:0 "Though I have sought to honor [ROOT.Char.GetFaith.HighGodName], as I approach the threshold of eternity, I worry if my soul will be judged fit for his [ROOT.Char.GetFaith.DivineRealm]?\n\n"
 ci_pam_decision_events.0005.desc.notalone:0 "At my side are my [ROOT.Char.Custom2('PartnerOpinionDescription', SCOPE.sC('fam_or_friend_1') )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('fam_or_friend_1'))], [fam_or_friend_1.GetFirstName], and others who would pray for my soul."
 ci_pam_decision_events.0005.desc.outro:0 "My confessor, the [ROOT.Char.GetFaith.ReligiousText] in hand, advises me to, "Face the [ROOT.Char.GetFaith.HighGodName] without deception!"\n\nEven His seventeen apostles, who had walked in error before they walked with Him, were made clean when they laid their hearts bare."
 ci_pam_decision_events.0005.details:0 "You will have opportunities to [lease|E] [titles|E], or if you have no available ones, donate [gold|E] to [monastic_holy_orders|E], [holy_orders|E] or the Adeptus Ministorum - this will provide beneficial [modifiers|E] for your [player_heir|E]"
 ci_pam_decision_events.0005.no_last_rites_warning:0 "@warning_icon! #X If you do not Receive Last Rites:\n$BULLET_WITH_TAB$You lose [legitimacy_i][EmptyScope.ScriptValue('massive_legitimacy_gain')]\n$BULLET_WITH_TAB$$every_zealot_vassal$:\n$TAB$$BULLET_WITH_TAB$Loses #N 30#! [opinion|E] of #V you#! #!"
 ci_pam_decision_events.0005.secret_reveal:0 "@alert_icon! #alert_trial You may need to reveal a [secret|E]"
 ci_pam_decision_events.0005.t:0 "Last Rites: My Final Hour"
 ci_pam_decision_events.0006.a:0 ""Forgive me, [confessor.GetMotherFather]...""
 ci_pam_decision_events.0006.b:0 "Some sins should go to the grave with me."
 ci_pam_decision_events.0006.b.flavor:0 "You confess some sins, but hold back on secrets that might implicate others."
 ci_pam_decision_events.0006.desc.bad:0 "\n\nMy sins have been great and frequent. My soul weighs heavy, grasped in the searing fingers of the [ROOT.Char.GetFaith.DevilName], intent to take which is so clearly his.\n\n"
 ci_pam_decision_events.0006.desc.good:0 "\n\nMy heart is light as my actions have been in keeping with the [ROOT.Char.GetFaith.HighGodNamePossessive] will.\n\n"
 ci_pam_decision_events.0006.desc.my_criminal_trait_sin:0 "Perhaps worst of all, I am a [my_criminal_trait.GetName(soon_dead)]! My suffocating guilt chokes every breath."
 ci_pam_decision_events.0006.desc.my_sinful_trait_sin:0 "How often have I been led astray by my [my_sinful_trait.GetName(soon_dead)] nature!"
 ci_pam_decision_events.0006.desc.neutral:0 "\n\nI am but a [ROOT.Char.GetWomanMan], and sin has found me despite my best intentions.\n\n"
 ci_pam_decision_events.0006.desc.outro:0 "I must lay bare my sins with proper contrition, or be denied Communion."
 ci_pam_decision_events.0006.desc.secret_sin:0 "I have harbored in a port of darkness my being a [my_secret.GetName]."
 ci_pam_decision_events.0006.desc.sin_default:0 "My sins, though assuredly many, are hard to call to mind. I am sure they will flow as if an ocean overrunning a dike, once I speak to [confessor.GetTitledFirstNameNoTooltip]."
 ci_pam_decision_events.0006.desc.sin_default_good_sp:0 "May [ROOT.Char.GetFaith.HighGodName] crush my bones and blot out iniquity."
 ci_pam_decision_events.0006.intro:0 ""To err is human. But without confession, there can be no absolution," says [confessor.GetTitledFirstName]."
 ci_pam_decision_events.0006.t:0 "Last Rites: My Sin is Ever Before Me"
 ci_pam_decision_events.0007.a:0 "May the [monastic_order.GetName] pray for me."
 ci_pam_decision_events.0007.b:0 "I would bolster the [military_order.GetName]."
 ci_pam_decision_events.0007.c:0 "[religious_head.GetTitledFirstNameNoTooltip] may have my wealth, and I [religious_head.GetHerHis] prayers."
 ci_pam_decision_events.0007.d:0 "A pious word to [confessor.GetTitledFirstNameNoTooltip] is enough."
 ci_pam_decision_events.0007.desc.bad:0 "Even now as the Communion is presented I hear the whispers of the Daemon Princeps' servants begging me to give over my soul, so I may live on and indulge in worldly pleasures.\n\n"
 ci_pam_decision_events.0007.desc.good:0 "Having unburdened myself, I leap to the embrace of death. I long to receive the Communion of the [ROOT.Char.GetFaith.HighGodName], beside whom I shall soon stand.\n\n"
 ci_pam_decision_events.0007.desc.neutral:0 "May the Communion of the [ROOT.Char.GetFaith.HighGodName] guard me against the demons who lurk like wolves, here to take me before my appointed time.\n\n"
 ci_pam_decision_events.0007.desc.oil.bad:0 "My soul remains troubled.\n\n"
 ci_pam_decision_events.0007.desc.oil.good:0 "My soul beams with the [ROOT.Char.GetFaith.HighGodNamePossessive] light.\n\n"
 ci_pam_decision_events.0007.desc.oil.intro:0 "[confessor.GetSheHe|U] then anoints my forehead, hands and feet with holy oil."
 ci_pam_decision_events.0007.desc.oil.neutral:0 "My soul feels guarded for its journey.\n\n"
 ci_pam_decision_events.0007.desc.outro:0 "The Communion and the anointing complete, I can plan for who will pray for me."
 ci_pam_decision_events.0007.intro:0 "So has passed the accounting of my sins. Some debts are counted in coppers, others in crowns.\n\nMy confessor presents the consecrated bread and wine of the Communion."
 ci_pam_decision_events.0007.t:0 "Last Rites: Bread, Wine and Oil"
 ci_pam_decision_events.0015.b:0 ""I have many a miracle to my name.""
 ci_pam_decision_events.0015.b.flavor:0 "Why settle for the Papacy, when you could be canonized?"
 ci_pam_decision_events.0015.b.tt:0 "#V Increase Chance of Canonization#! after death\n#weak Requires a [dynasty|E] to be canonized#!"
 ci_pam_decision_events.0015.c:0 "If the [ROOT.Char.GetFaith.HighGodName] wishes me to lead..."
 ci_pam_decision_events.0015.c.flavor:0 "...I must rise to the occasion"
 ci_pam_decision_events.0015.c.tt:0 "#V Increase Election Score#! for [praise_worthy_priest_superior_title.GetName]: #P +30#!"
 ci_pam_decision_events.0015.d:0 "Let no other name be spoken."
 ci_pam_decision_events.0015.d.flavor:0 "Empty the coffers of my devotion; I will not be second"
 ci_pam_decision_events.0015.d.tt:0 "#V Increase Election Score#! for [praise_worthy_priest_superior_title.GetName]: #P +[praise_worthy_priest.MakeScope.ScriptValue('pam_papabile_place_first_populist_value')|0]#!, enough to stand first as $theocratic_elective_populist$\nRequires @piety_icon![praise_worthy_priest.MakeScope.ScriptValue('pam_place_first_as_populist_piety_cost_value')|0] [piety|E]"
 ci_pam_decision_events.0015.desc.bad:0 "\n\nDespite the laudatory words, my heart fears the kiss of hellfire."
 ci_pam_decision_events.0015.desc.good:0 "\n\nTruly, I am an instrument of the [ROOT.Char.GetFaith.HighGodName], a manifestation of his beauty on earth."
 ci_pam_decision_events.0015.desc.intro:0 "the encomium crafted by my [GetDomicileBuilding('chancery_01').GetName]:\n\n"Virtuous deeds are like seeds, planted by the [ROOT.Char.GetFaith.HighGodName], there to flourish into pious bounty. All should know [praise_worthy_priest.GetName], for [praise_worthy_priest.GetHerHis] noble"
 ci_pam_decision_events.0015.desc.intro.no_praiser:0 "My loyal priests share"
 ci_pam_decision_events.0015.desc.intro.praiser:0 "My influential [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('my_praiser'))], [my_praiser.GetTitledFirstName], shares"
 ci_pam_decision_events.0015.desc.mid:0 "virtues, ever guided by"
 ci_pam_decision_events.0015.desc.neutral:0 "\n\nDespite the laudatory words, only in death will I know if my soul is right with the [ROOT.Char.GetFaith.HighGodName]."
 ci_pam_decision_events.0015.desc.novirtuoustenet:0 "the [ROOT.Char.GetFaith.HighGodName]...""
 ci_pam_decision_events.0015.desc.outro:0 "\n\n"...indeed, by the righteousness of [praise_worthy_priest.GetHerHis] deeds, this is the manner of [praise_worthy_priest.GetWomanMan] who could one day lead the Adeptus Ministorum!""
 ci_pam_decision_events.0015.desc.virtuoustenet:0 "[my_virtuous_tenet.GetName( praise_worthy_priest.GetRite )]...""
 ci_pam_decision_events.0015.desc.virtuoustrait:0 "and [my_virtuous_trait.GetName(praise_worthy_priest)]"
 ci_pam_decision_events.0015.t:0 "Promulgate Word of Pious Deeds"
 ci_pam_decision_last_rites_confirm:0 "Gather to my bedside"
 ci_pam_decision_last_rites_desc:0 "#EMP Look upon me, O [ROOT.Char.GetFaith.HighGodName]! Lift from me the weight of my iniquity, and let my soul pass clean into Your light.#!\n\nWith my imminent departure from this carnal existence, I hope to set my soul in order. Armored from infernal influence, I may then find a good death and eternal life, housed in [ROOT.Char.GetFaith.DivineRealm]."
 ci_pam_decision_last_rites_doctrine_tt:0 "[faith|E] must have the [GetDoctrineType('doctrine_sacraments_central').GetBaseName] [doctrine|E]"
 ci_pam_decision_last_rites_name:0 "Receive Last Rites"
 ci_pam_decision_last_rites_name_low:0 "Receive Last Rites"
 ci_pam_decision_last_rites_sp_tooltip:0 "Your [spiritual_fulfillment|E] is at least #V [EmptyScope.ScriptValue('spiritual_fulfillment_1')|0]#!"
 ci_pam_decision_last_rites_tooltip:0 "Prepare your soul for departure"
 ci_pam_decision_last_rites_tooltip_sp_effect:0 "You will gain some [spiritual_fulfillment|E] @spiritual_fulfillment_icon!"
 ci_pam_last_rites_church_donation_modifier:0 "Predecessor Donated to the Faith During Last Rites"
 ci_pam_mentor_sp_decision:0 "Provide Spiritual Guidance"
 ci_pam_mentor_sp_decision_confirm:0 "Speak, and listen."
 ci_pam_mentor_sp_decision_desc:0 "We who walk in [ROOT.Char.GetFaith.HighGodNamePossessive] light have a duty to guide those lost in darkness, and those whose youth may cause them to stray in thought or deed."
 ci_pam_mentor_sp_decision_desc_tooltip:0 "Help a child with their [spiritual_fulfillment|E]"
 ci_pam_mentor_sp_decision_primary_favorite_child_name:0 "Favorite Child"
 ci_pam_mentor_sp_decision_primary_favorite_child_tt:0 "Your [favorite_child|E] must:$ci_pam_mentor_sp_decision_primary_requirements_tt$"
 ci_pam_mentor_sp_decision_primary_heir_name:0 "Primary Heir"
 ci_pam_mentor_sp_decision_primary_heir_tt:0 "Your [primary_heir|E] must:$ci_pam_mentor_sp_decision_primary_requirements_tt$"
 ci_pam_mentor_sp_decision_primary_requirements_tt:0 "\n$BULLET_WITH_TAB$Have the same [faith|E] as you\n$BULLET_WITH_TAB$Be at least #V 16#! years old\n$BULLET_WITH_TAB$Have a lower [spiritual_fulfillment|E] than #V 75#!\n$BULLET_WITH_TAB$Cannot have received spiritual guidance before"
 ci_pam_mentor_sp_decision_sp_tooltip:0 "Your [spiritual_fulfillment|E] is at least #V [EmptyScope.ScriptValue('spiritual_fulfillment_3')|0]#!"
 ci_pam_mentor_sp_decision_tooltip_effect:0 "You will increase the [spiritual_fulfillment|E] of your [primary_heir|E] or [favorite_child|E]"
 ci_pam_mentor_sp_decision_valid_child_tt:0 "You need to have a [child|E] that:\n$BULLET_WITH_TAB$Has the same [faith|E] as you\n$BULLET_WITH_TAB$Is at least #V 16#! years old\n$BULLET_WITH_TAB$Is either your [primary_heir|E] or [favorite_child|E]\n$BULLET_WITH_TAB$Has a lower [spiritual_fulfillment|E] than #V 75#!\n$BULLET_WITH_TAB$Has not received spiritual guidance before"
 ci_pam_promulgate_word_of_pious_deeds_decision:0 "Promulgate Word of Pious Deeds"
 ci_pam_promulgate_word_of_pious_deeds_decision_confirm:0 "Permit their praise!"
 ci_pam_promulgate_word_of_pious_deeds_decision_desc:0 "My chancery has assembled an encomium praising deeds worthy of the [ROOT.Char.GetFaith.HighGodName]. Though it is unbecoming to extol my own virtues, those close to me wish to spread word of my godliness to all [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip].\n\nWith such knowledge, word might spread that I am the [ROOT.Char.GetWomanMan] most worthy to ascend to the seat of the [ROOT.Char.GetFaith.ReligiousHeadName]... and beyond."
 ci_pam_promulgate_word_of_pious_deeds_decision_desc_tooltip:0 "#V Increase Election Score#! for [Select_CString(ROOT.Char.GetReligiousSuperior.IsValid, ROOT.Char.GetReligiousSuperior.GetPrimaryTitle.GetName, ROOT.Char.GetPrimaryTitle.GetName)]: #P +30#! or Improve Chances for [canonization|E]"
 ci_pam_promulgate_word_of_pious_deeds_decision_tooltip_effect:0 "Choose Between: \n\t$EFFECT_LIST_BULLET$Pay [piety|E] to #V Increase Election Score#! for [praise_worthy_priest_superior_title.GetName] \n\t$EFFECT_LIST_BULLET$Improve your chance at future [canonization|E]"
