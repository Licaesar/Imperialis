l_english:

 # Textos funcionais do sistema clerical (marco 3). Termos do vanilla (College of Cardinals, Cardinal) sao provisorios: o autor renomeia (ver ESTADO).
 ci_found_ministorum_college_tooltip:0 "The #V College of Cardinals#! is filled with up to 10 electors, and future Heads of Faith are chosen by election. The Head of Faith, the cardinals and the landed clergy of the faith use the #V Ecclesiastical#! government."
 ci_found_ministorum_romagna_tooltip:0 "The Head of Faith receives the #V Duchy of Romagna#! and all its counties from whoever holds them. They stay independent until the Emperor of Italy makes them a vassal."
 clerical_elector_duchy_cardinalate_imperialis:0 "Cardinalate"
 ci_doctrine_has_clerical_regions_name:0 "Clerical Regions"
 ci_has_clerical_regions_name:0 "$ci_doctrine_has_clerical_regions_name$"
 ci_doctrine_has_clerical_regions_desc:0 "The clergy of the faith are organised in clerical regions under archbishops."
 # Titular de regiao clerical: mesmo termo do duque do clero (arcebispo sem terras). O autor pode trocar.
 duke_theocracy_male_imperialis_religion_clerical_region:0 "$duke_theocracy_male_imperialis_religion$"
 duke_theocracy_female_imperialis_religion_clerical_region:0 "$duke_theocracy_female_imperialis_religion$"
 # Lider de ordem monastica do Imperialis (o vanilla usa "Sage"). Termos do autor.
 duke_monastic_order_male_imperialis_religion:0 "Maestre"
 duke_monastic_order_female_imperialis_religion:0 "Maestra"
 king_monastic_order_male_imperialis_religion:0 "$duke_monastic_order_male_imperialis_religion$"
 king_monastic_order_female_imperialis_religion:0 "$duke_monastic_order_female_imperialis_religion$"
 # Lider de ordem militar do Imperialis (o vanilla usa "Katepano" para culturas de heranca bizantina). Termo decidido pelo autor.
 holy_order_male_imperialis_religion:0 "Preceptor"
 holy_order_female_imperialis_religion:0 "Preceptrix"
 # Bencao do Ministorum (marco 4, fase 4a). Descricao de lore aprovada pelo autor (4b).
 ci_doctrine_ministorum_blessing_name:0 "Blessing of the Ministorum"
 ci_doctrine_ministorum_blessing_desc:0 "By the seal of the Adeptus Ministorum, this [rite|E] is held to be a true path within the Veritas Imperialis. Its observances are no longer counted as straying from the Cultus Imperialis, but as another facet of the Omnissiah's truth, and its [rite_divergence|E] is lessened accordingly."
 ci_ministorum_blessing_group_name:0 "$ci_doctrine_ministorum_blessing_name$"
 doctrine_parameter_ci_ministorum_blessing_divergence:0 "$doctrine_parameter_special_doctrine_pope_blessing_divergence$"
 # Titulo do Head of Faith quando e mulher (marco 4, fase 4b; aprovado pelo autor). O masculino continua Ecclesia Maximus.
 sol_religious_head_title_female:0 "Ecclesia Maxima"
