l_english:
 matrimonium_imperiale_name:0 "Matrimonium Imperiale"
 matrimonium_imperiale_desc:0 "Among the Imperialis, marriage is a covenant of the Imperium itself. A ruler takes but one lawful spouse, yet the thrones of emperors and hegemons are attended by many consorts, so that the imperial line shall never want for heirs. Unions are sought among their own people and within the bounds of the realm, for a foreign match is held to dilute both blood and custom; yet so admired are their ways that other peoples gladly bind their traditions to theirs."

 custodia_imperialis_name:0 "Custodia Imperialis"
 custodia_imperialis_desc:0 "To defend the Imperium is a sacred calling. The faithful train in arms alongside the warriors of the realm, mastering horse and blade so that martial strength may serve both the Emperor and the divine."

 administratum_name:0 "Administratum Imperialis"
 administratum_desc:0 "An empire must be governed as carefully as it is won. Its courtiers and stewards seek distinction through service, competing for influence while keeping the far-reaching affairs of the realm in order."

 mysterium_divinitas_name:0 "Mysterium Divinitas"
 mysterium_divinitas_desc:0 "The divine is not known through faith alone, but approached through study, contemplation, and the wisdom of mystics. Imperialis scholars seek hidden truths, believing that spiritual insight can illuminate both the soul and the world."

