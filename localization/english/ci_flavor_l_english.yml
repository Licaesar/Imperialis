l_english:
 # Decisoes de flavor e ordens monasticas (marco 5, fase 5e). Texto criado pelo Claude e contado ao autor.

 ci_vigil_tomb_omnissiah_decision:0 "Vigil at the Tomb of the Omnissiah"
 ci_vigil_tomb_omnissiah_decision_desc:0 "On Mount Olympus the Lawgiver lies, and the Legists keep watch at His tomb as He once kept watch over the seventeen. A night of silence beside the stone, reading the Law aloud until the dawn, clears the mind of every doubt."
 ci_vigil_tomb_omnissiah_decision_tooltip:0 "Keep a night's vigil at the tomb of the Omnissiah"
 ci_vigil_tomb_omnissiah_decision_confirm:0 "The Law, until the dawn."
 ci_vigil_of_the_law_modifier:0 "Vigil of the Law"
 ci_vigil_of_the_law_modifier_desc:0 "This character has kept vigil at the tomb of the Omnissiah on Mount Olympus."

 ci_muster_the_legio_decision:0 "Muster the Legio"
 ci_muster_the_legio_decision_desc:0 "The Legio Imperialis that followed the Omnissiah out of Jerusalem never truly disbanded. Its eagles sleep in every templum of the realm, waiting for an emperor of the faith to call them out again."
 ci_muster_the_legio_decision_tooltip:0 "Call the Legio Imperialis to arms for ten years"
 ci_muster_the_legio_decision_confirm:0 "Ad signa, Legio!"
 ci_legio_mustered_modifier:0 "The Legio Mustered"
 ci_legio_mustered_modifier_desc:0 "The Legio Imperialis has answered the call of its emperor."

 ci_commission_codex_decision:0 "Commission a Codex"
 ci_commission_codex_decision_desc:0 "The words of the Omnissiah must be copied, and copied well. A codex commissioned in my name, bound in leather and gold and checked line by line against the oldest copies, will serve my house for generations."
 ci_commission_codex_decision_tooltip:0 "Commission a new copy of the sacred texts"
 ci_commission_codex_decision_confirm:0 "Let the scribes begin."
 ci_commission_codex_decision_effect_tt:0 "You receive a personal artifact: the #V Codex Imperialis#! (+2 monthly [piety|E]) or, for the Lex Omnissiah, the #V Codex Legis#! (+2 [learning|E])"
 ci_codex_imperialis_artifact_name:0 "Codex Imperialis"
 ci_codex_imperialis_artifact_desc:0 "A copy of the sacred texts of the Veritas Imperialis, with the genealogies of the Sanguinis illuminated in gold on its opening pages."
 ci_codex_legis_artifact_name:0 "Codex Legis"
 ci_codex_legis_artifact_desc:0 "A copy of the Law of the Omnissiah as the Legists keep it: no genealogies and no illuminations, only the Law, written in a hand so careful that not a word could be mistaken."

 ci_raise_signa_imperialis_decision:0 "Raise the Signa Imperialis"
 ci_raise_signa_imperialis_decision_desc:0 "The Signa Imperialis, the holy standard of the faith, is raised only once in a lifetime, and only by one in whom the blood of the Omnissiah runs pure. Where it flies, the faithful know that His heir rides with them."
 ci_raise_signa_imperialis_decision_tooltip:0 "Raise the holy standard of the faith, once in your lifetime"
 ci_raise_signa_imperialis_decision_confirm:0 "Raise the Signa!"
 ci_signa_imperialis_modifier:0 "Bearer of the Signa Imperialis"
 ci_signa_imperialis_modifier_desc:0 "This Sanguinis has raised the Signa Imperialis, the holy standard of the faith."

 ci_register_blood_decision:0 "Register the Blood"
 ci_register_blood_decision_desc:0 "Every child of the Sanguinis in our dynasty must be written into the Liber Sanguinis, the great register of the divine blood, with the degree of their blood and the names of their parents. What is written there cannot be denied."
 ci_register_blood_decision_tooltip:0 "Write the Sanguinis of your dynasty into the Liber Sanguinis"
 ci_register_blood_decision_confirm:0 "Write their names."
 ci_register_blood_recent_tt:0 "The Sanguinis of your dynasty were registered less than 25 years ago"
 ci_register_blood_members_tt:0 "Every living Sanguinis of your dynasty gains #V Written in the Liber Sanguinis#!"
 ci_liber_sanguinis_modifier:0 "Written in the Liber Sanguinis"
 ci_liber_sanguinis_modifier_desc:0 "This Sanguinis is recorded in the Liber Sanguinis, the great register of the divine blood."

 ci_found_scholam_decision:0 "Found a Scholam"
 ci_found_scholam_decision_desc:0 "The Law is not inherited; it is learned. A Scholam in my capital, where any child who can read may come to study the Law of the Omnissiah, will raise a generation that needs neither priests nor princes to tell it what the Law says."
 ci_found_scholam_decision_tooltip:0 "Found a school of the Law in your capital county"
 ci_found_scholam_decision_confirm:0 "Open the doors of the Scholam."
 ci_found_scholam_exists_tt:0 "Your capital county already has a Scholam"
 ci_scholam_legis_modifier:0 "Scholam Legis"
 ci_scholam_legis_modifier_desc:0 "A school of the Law of the Omnissiah teaches here."

 holy_order_ci_sorores_undomiel:0 "Sorores Undómiel of [PROVINCE.GetTitle.GetNameNoTierNoTooltip]"
 holy_order_ci_fratres_codicis:0 "Fratres Codicis of [PROVINCE.GetTitle.GetNameNoTierNoTooltip]"
 holy_order_ci_schola_legis:0 "Schola Legis of [PROVINCE.GetTitle.GetNameNoTierNoTooltip]"
 holy_order_ci_ascetae_harmoniae:0 "Ascetae Harmoniae of [PROVINCE.GetTitle.GetNameNoTierNoTooltip]"
