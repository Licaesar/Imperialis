l_english:
 # Juntar-se a vanguarda Lipherianii (pedido do autor, 11/10/2026). Texto criado pelo Claude.
 ci_join_lipherianii_decision:0 "Join the Lipherianii Vanguard"
 ci_join_lipherianii_decision_desc:0 "The courts of the Imperium have grown soft with silk and ceremony, but the road has taught me otherwise. The Lipherianii still march as the Omnissiah's first companions did, measuring worth by deeds alone. Let me cast off the manners of the court and take my place among them."
 ci_join_lipherianii_decision_tooltip:0 "Leave the Imperialis culture behind and adopt the #V Lipherianii#! culture"
 ci_join_lipherianii_decision_confirm:0 "To the vanguard!"
