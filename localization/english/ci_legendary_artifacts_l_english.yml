l_english:
 # Artefatos lendarios do Kensoriel. Texto criado pelo Claude e contado ao autor.
 ci_relic_lipheria_name:0 "Lipheria"
 ci_relic_lipheria_desc:0 "The sword of the house of Liphe, older than the name it gave. The Omnissiah carried it beside Lux Omnissiae, and swore that every Liphe who bore it would be judged by what he did with it, not by whose blood he had."
 ci_relic_sanguinolius_name:0 "Sanguinolius"
 ci_relic_sanguinolius_desc:0 "A black blade with a single red stone in its pommel, which warms in the hands of the Sanguinis and stays cold in all others. Its curved quillons were made to catch a blow and return it; those who have crossed it say it remembers every wound it has taken."
 ci_relic_anulus_vitae_name:0 "Anulus Vitae"
 ci_relic_anulus_vitae_desc:0 "A silver ring wrought with coiling serpents around a green stone. Helaena Undómiel slipped it onto the Omnissiah's hand in the camp at Jerusalem, saying that the dying should not be the only ones to know the worth of a day."
 ci_relic_anulus_ignis_name:0 "Anulus Ignis"
 ci_relic_anulus_ignis_desc:0 "A heavy gold ring set with rubies, one for every fortress the Omnissiah vowed to take without burning. It is warm to the touch and sits best on a hand that has held a sword."
 ci_relic_anulus_caeli_name:0 "Anulus Caeli"
 ci_relic_anulus_caeli_desc:0 "A gold ring with a blue stone worked into a stepped pattern, said to map the sky above the Temple Mount on the morning the Omnissiah appeared. Scholars of the Codex turn it to the light when they argue, and seldom lose."
 ci_relic_anulus_terrae_name:0 "Anulus Terrae"
 ci_relic_anulus_terrae_desc:0 "A broad gold ring with a faceted green stone, cut to the shape of a field seen from above. Whoever wears it is said to hear the land asking to be tended: roads, granaries and treasuries all answer to it."
