 # Concordia Omnissiae (marco 5, fase 5b): doutrina dos quatro ritos que faz Veritas Imperialis e Lex Omnissiah se verem astray.
 # Texto criado pelo Claude e contado ao autor.
 ci_doctrine_omnissiae_concord_name:0 "Concordia Omnissiae"
 ci_doctrine_omnissiae_concord_desc:0 "The Veritas Imperialis and the Lex Omnissiah walk different roads, yet both kneel before the same Omnissiah. Until one of them names the other heretical, each holds the other to be Astray rather than Hostile, and no holy war may be called between them."
 ci_omnissiae_concord_name:0 "Concordia"
