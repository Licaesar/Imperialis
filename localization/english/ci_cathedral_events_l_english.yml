l_english:

 # Eventos das obras de catedral em versao do Imperialis (marco 4, fase 4b): texto aprovado pelo autor em 10/10/2026.
 # Gerado por docs/dev/regen_cathedral_events.py a partir da localizacao vanilla; as chaves sem troca repetem o texto vanilla.
 ci_pam_great_projects_events.0002.a:0 "The Omnissiah descending as a ray of the sun upon the Temple Mount."
 ci_pam_great_projects_events.0002.b:0 "The apostles awaiting His coming in Jerusalem."
 ci_pam_great_projects_events.0002.c:0 "The seventeen apostles setting out from the Holy City."
 ci_pam_great_projects_events.0002.d:0 "Undómiel kneeling in prayer at the Omnissiah's side."
 ci_pam_great_projects_events.0002.desc:0 "While the ecclesiastes may consult the Codex Imperialis, it is holy images that show the faithful the truth and glory of the Omnissiah.\n\nWith the necessary funds gathered and painters assembled, I must decide which scenes of the sacred history will adorn the vaults, walls, and ceilings."
 ci_pam_great_projects_events.0002.e:0 "The Omnissiah's mind aflame with the light of the sun."
 ci_pam_great_projects_events.0002.f:0 "The Omnissiah tending the wounds of the Legio."
 ci_pam_great_projects_events.0002.learning_xp:0 "Once the [grand_cathedral|E] is completed, its [point_of_interest|E] will provide @skill_learning_icon![learning|E] [lifestyle_experience|lE], and [spiritual_fulfillment|E] to the faithful"
 ci_pam_great_projects_events.0002.mystic_xp:0 "Once the [grand_cathedral|E] is completed, its [point_of_interest|E] will provide increased [trait_level_track_xp|E] for those with the [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )] [trait|E]"
 ci_pam_great_projects_events.0002.piety:0 "Once the [grand_cathedral|E] is completed, its [point_of_interest|E] will provide @piety_icon![piety|E]"
 ci_pam_great_projects_events.0002.pilgrim_xp:0 "Once the [grand_cathedral|E] is completed, its [point_of_interest|E] will provide [trait_level_track_xp|E] for those with the [GetTrait('pilgrim').GetName( GetNullCharacter )] [trait|E]"
 ci_pam_great_projects_events.0002.scholar_xp:0 "Once the [grand_cathedral|E] is completed, its [point_of_interest|E] will provide [trait_level_track_xp|E] for those with the [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )] [trait|E]"
 ci_pam_great_projects_events.0002.stress_loss:0 "Once the [grand_cathedral|E] is completed, its [point_of_interest|E] will provide @stress_loss_icon![stress_loss|E]"
 ci_pam_great_projects_events.0002.t:0 "$game_concept_grand_cathedral$: Holy Frescoes for [province.GetNameNoTooltip]"
 ci_pam_great_projects_events.0003.a:0 "A Tree of the Sanguinis, upholding [ROOT.Char.GetDynastyNameNoTooltip] legitimacy."
 ci_pam_great_projects_events.0003.a.flavor:0 "[Glossary('Tree of the Sanguinis','CI_TREE_OF_SANGUINIS_GLOSS')]"
 ci_pam_great_projects_events.0003.a.tt:0 "Once the [grand_cathedral|E] is completed, its [point_of_interest|E] will provide @dynasty_prestige_icon![dynasty_prestige|E] to [dynasty|E] members who visit as [travel|E] leaders"
 ci_pam_great_projects_events.0003.b:0 "A donor panel with your portrait and arms."
 ci_pam_great_projects_events.0003.b.tt:0 "Once the [grand_cathedral|E] is completed, its [point_of_interest|E] will provide @prestige_icon![prestige|E] to visitors"
 ci_pam_great_projects_events.0003.c:0 "Scenes of the miracles of Jerusalem, to beckon worshipers from afar."
 ci_pam_great_projects_events.0003.c.tt:0 "Once the [grand_cathedral|E] is completed, its [point_of_interest|E] will provide increased [trait_level_track_xp|E] for those with the [GetTrait('pilgrim').GetName( GetNullCharacter )] [trait|E]"
 ci_pam_great_projects_events.0003.d:0 "An Undómiel window, with a perpetual lamp before it."
 ci_pam_great_projects_events.0003.d.dulia.tt:0 "Having [GetTenetType('tenet_dulia').GetBaseName] as a [personal_tenet|E] grants greater [spiritual_fulfillment|E] on visit"
 ci_pam_great_projects_events.0003.d.flavor:0 "He shall keep a lamp of oil and candles lit before the image in glass of [blessed_mary.GetTitledFirstName]."
 ci_pam_great_projects_events.0003.d.tt:0 "Once the [grand_cathedral|E] is completed, its [point_of_interest|E] will provide @stress_loss_icon![stress_loss|E] and [spiritual_fulfillment|E]"
 ci_pam_great_projects_events.0003.desc:0 ""#EMP Light was the first word the Omnissiah spoke to us, and glass is how we keep it.#!" [religion_buddy.GetTitledFirstName] says when laying eyes on the cut glass, gleaming in the sun.\n\nThe glazier [glazier.GetTitledFirstName], has laid fragments of [Glossary('pot metal','POT_METAL_GLOSS')] on whitewashed tables for us to better peruse prospective designs.\n\nI declare, "This window will be seen from both the nave and across [province.GetNameNoTooltip], it must depict...""
 ci_pam_great_projects_events.0003.e:0 "A cycle of the apostles' trials at the hands of the Infideles."
 ci_pam_great_projects_events.0003.e.owner_msg.desc:0 "[contributor.GetTitledFirstName] has commissioned a stained glass cycle of the apostles' trials for the [grand_cathedral|E]. The subject moves you to deeper devotion."
 ci_pam_great_projects_events.0003.e.owner_msg.title:0 "Trials in Glass"
 ci_pam_great_projects_events.0003.e.tt:0 "Once the [grand_cathedral|E] is completed, its [point_of_interest|E] grants zealous visitors extra @piety_icon![piety|E] and @stress_loss_icon![stress_loss|E]."
 ci_pam_great_projects_events.0003.t:0 "$game_concept_grand_cathedral$: Painted Light Over [province.GetNameNoTooltip]"
 ci_pam_great_projects_events.0005.a:0 ""Our children will see it fulfilled.""
 ci_pam_great_projects_events.0005.desc.contributor:0 "\n\nNotably, [optional_contributor.GetTitledFirstNamePossessive] contribution of [contribution.GetName] will further immortalize our [cathedral_building.GetName]."
 ci_pam_great_projects_events.0005.desc.intro:0 "The first stone is laid! Like an acorn preceding an oak, the seat of [owner.GetTitledFirstName] will grow into an edifying monument. Each stone and timber will radiate the glory of [ROOT.Char.GetFaith.HighGodName] to all [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] in the [owner.GetPrimaryTitle.GetNameNoTier] and across the whole of the Imperium.\n\n[CharMyFirstNames(founder)|U] magnanimity in funding the construction will echo out from the bells and be in the mouth of every worshiper."
 ci_pam_great_projects_events.0005.desc.outro:0 "Let the great work begin!"
 ci_pam_great_projects_events.0005.t:0 "$game_concept_grand_cathedral$: The First Stone Laid"
 ci_pam_great_projects_events.0006.a:0 "Dig a crypt for [founder.GetDynastyNameNoTooltip] ancestors."
 ci_pam_great_projects_events.0006.a.tt:0 "A [GetDomicileBuilding('cathedral_crypt_01').GetName|V] is built in [owner.GetShortUINamePossessive] [cathedral_complex|E], honoring the [founder.GetDynastyName] [dynasty|E]"
 ci_pam_great_projects_events.0006.b:0 "Extend the nave to account for pilgrims."
 ci_pam_great_projects_events.0006.b.tt:0 "Once the [grand_cathedral|E] is completed, its [point_of_interest|E] will provide improved [GetTrait('pilgrim').GetName( GetNullCharacter )] [trait_level_track_xp|E] and @piety_icon![piety|E] for visiting pilgrims"
 ci_pam_great_projects_events.0006.c:0 "The Omnissiah alone can guide the proceedings."
 ci_pam_great_projects_events.0006.desc.ad_quadratum_ref:0 "employing [Glossary('ad quadratum','AD_QUADRATUM_GLOSS')]! The Omnissiah has revealed to us divine order; with the use of a square we can extrapolate the proportions for a building more grand than any [ROOT.Char.Custom('ResidenceBuilding')].""
 ci_pam_great_projects_events.0006.desc.architect_explanation:0 "\n\n"We are $ci_pam_great_projects_events.0006.desc.ad_quadratum_ref$"
 ci_pam_great_projects_events.0006.desc.foundations:0 "\n\nI see digging will soon begin for the foundations."
 ci_pam_great_projects_events.0006.desc.intro:0 "a series of wooden stakes, with rope drawn taut between them forming the outline of an enormous Signa Imperialis; a vision of the templum to come."
 ci_pam_great_projects_events.0006.desc.intro_architect:0 "My [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('architect'))] [architect.GetFirstName] points to"
 ci_pam_great_projects_events.0006.desc.intro_no_architect:0 "I look out on"
 ci_pam_great_projects_events.0006.desc.steward_architect:0 "\n\n"But how does one plan for such a grand edifice?" I ask."
 ci_pam_great_projects_events.0006.desc.steward_founder:0 "\n\nI have seen this process in my studies!\n\n"You must be $ci_pam_great_projects_events.0006.desc.ad_quadratum_ref$"
 ci_pam_great_projects_events.0006.t:0 "$game_concept_grand_cathedral$: Laid Out With Divine Order"
 ci_pam_great_projects_events.0007.a:0 "Adorn the vaults with the night sky."
 ci_pam_great_projects_events.0007.a.tt:0 "Once the [grand_cathedral|E] is completed, its [point_of_interest|E] will provide improved [trait_level_track_xp|E] for those with the [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )] [trait|E]"
 ci_pam_great_projects_events.0007.b:0 "Preach a sermon on the Daemon Princeps and the price of pride."
 ci_pam_great_projects_events.0007.b.tt:0 "Your [faith|E] gains @fervor_icon!#P [EmptyScope.ScriptValue('trivial_fervor_value')|1]#! [fervor|E]"
 ci_pam_great_projects_events.0007.c:0 "Let the masons get on with it."
 ci_pam_great_projects_events.0007.desc.architect:0 "\n\n"Once completed, these vaults will shelter worshipers from the elements and guide our prayers to the high heavens.""
 ci_pam_great_projects_events.0007.desc.architect_says:0 "[architect.GetSheHe] says."
 ci_pam_great_projects_events.0007.desc.intro_architect:0 "My [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('architect'))] [architect.GetFirstName] leads me through a great forest of beams. The cathedral scaffolding stands like a wooden church in its own right, supporting the masons hard at work on the stone vaulting."
 ci_pam_great_projects_events.0007.desc.intro_no_architect:0 "I walk through a great forest of beams. The cathedral scaffolding stands like a wooden church in its own right, as it supports masons working on the vaulting."
 ci_pam_great_projects_events.0007.desc.outro:0 "\n\nAs I rest my gaze on a bay of completed vaulting, it calls to mind the rays of the sun that bore the Omnissiah down upon the Temple Mount. Such is the glory of the templum, that one may feel carried from the earth up to the Aeternitas Paradisus."
 ci_pam_great_projects_events.0007.t:0 "$game_concept_grand_cathedral$: The Heaving Ribs of Heaven"
 ci_pam_great_projects_events.0008.a:0 "If he fails, I will kill him."
 ci_pam_great_projects_events.0008.a.tt:0 "If the casting fails, you will execute [bell_maker_son.GetShortUIName]"
 ci_pam_great_projects_events.0008.aa:0 "If he fails, I will flay the flesh from his body."
 ci_pam_great_projects_events.0008.b:0 "He could be an instrument of the Omnissiah."
 ci_pam_great_projects_events.0008.b.flavor:0 "Did the Omnissiah not find His seventeen apostles among those no one else had chosen?"
 ci_pam_great_projects_events.0008.b.tt:0 "You put your faith in [bell_maker_son.GetShortUIName] to cast the bell"
 ci_pam_great_projects_events.0008.belltower_may.tt:0 "A [GetDomicileBuilding('cathedral_belltower_02').GetName|V] may be built in [owner.GetShortUINamePossessive] [cathedral_complex|E]"
 ci_pam_great_projects_events.0008.c:0 "Find a safe bet, even if he is not the son of a master."
 ci_pam_great_projects_events.0008.desc.architect:0 "\n\n[architect.GetFirstName] tells me we must cast a great bronze bell!"
 ci_pam_great_projects_events.0008.desc.intro:0 "Construction progresses well, but the Cathedral is without a voice to summon worshipers from across the [owner.GetPrimaryTitle.GetNameNoTier]."
 ci_pam_great_projects_events.0008.desc.need_bell:0 "A risky and expensive endeavor; the coffers of [founder.GetPrimaryTitle.GetNameNoTier] are still reeling from the cost of the raw material alone."
 ci_pam_great_projects_events.0008.desc.no_architect:0 "\n\nWe must cast a bell!"
 ci_pam_great_projects_events.0008.desc.ordinary_body:0 "\n\n[bell_maker_son.GetFirstName], an ambitious young bronze-smith trained under a local master, has come forward. [bell_maker_son.GetSheHe|U] yearns to prove [bell_maker_son.GetHerHis] worth by casting a bell worthy of the [cathedral_building.GetName] of [owner.GetPrimaryTitle.GetNameNoTier]."
 ci_pam_great_projects_events.0008.desc.outro:0 "His son, [bell_maker_son.GetFirstName], assures me the secret knowledge was passed to [bell_maker_son.GetHerHim] at [bell_maker_son.GetHerHis] father's deathbed and can cast the bell."
 ci_pam_great_projects_events.0008.desc.plague_generic:0 "\n\nRegrettably, the bell maker perished in the recent pestilence."
 ci_pam_great_projects_events.0008.desc.plague_named:0 "\n\nRegrettably, the bell maker perished in the [epidemic.GetName]."
 ci_pam_great_projects_events.0008.duel.failure:0 "The cast fails... you must decide how to proceed"
 ci_pam_great_projects_events.0008.duel.success:0 "The cast succeeds! A [GetDomicileBuilding('cathedral_belltower_02').GetName|V] will be built in [owner.GetShortUINamePossessive] [cathedral_complex|E]"
 ci_pam_great_projects_events.0008.t:0 "$game_concept_grand_cathedral$: Casting the Voice of the Omnissiah"
 ci_pam_great_projects_events.0009.a:0 "Let the [province.Custom('GetTerrainType')|l] of [province.GetNameNoTooltip] hear the Omnissiah's voice."
 ci_pam_great_projects_events.0009.desc.body:0 "I watch as [bell_maker_son.GetFirstName] runs back and forth, marshaling the workers.\n\n[bell_maker_son.GetSheHe|U] constantly challenges [bell_maker_son.GetHerHis] father's old team, insisting on [bell_maker_son.GetHerHis] own way in choosing the location of the pit, the proper clay for the mold and firing of the furnaces."
 ci_pam_great_projects_events.0009.desc.body.architect:0 "[architect.GetFirstName] and I watch as [bell_maker_son.GetFirstName] runs back and forth, marshaling the workers.\n\n[bell_maker_son.GetSheHe|U] constantly challenges [bell_maker_son.GetHerHis] father's old team, insisting on [bell_maker_son.GetHerHis] own way in choosing the location of the pit, the proper clay for the mold and firing of the furnaces."
 ci_pam_great_projects_events.0009.desc.success_end:0 "\n\nThe molten bronze eases into the mold as if guided by the Omnissiah's hand, and emerges complete. It is then hoisted and rings out a clarion call to all [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]:\n\n"Come to the templum of the Omnissiah!""
 ci_pam_great_projects_events.0009.t:0 "$game_concept_grand_cathedral$: And the Omnissiah Spoke"
 ci_pam_great_projects_events.0010.a:0 "Promises must be kept."
 ci_pam_great_projects_events.0010.a.tt:0 "[bell_maker_son.GetShortUIName|U] is executed"
 ci_pam_great_projects_events.0010.b:0 "The cracked bell is punishment enough."
 ci_pam_great_projects_events.0010.b.faith:0 "The Omnissiah has a plan for him yet."
 ci_pam_great_projects_events.0010.c:0 "Melt the bronze. Forge something sharper."
 ci_pam_great_projects_events.0010.c.intrigue_xp.tt:0 "You gain [intrigue_lifestyle|E] [experience|E] instead"
 ci_pam_great_projects_events.0010.c.tt:0 "The cracked bell is recast into a torture device; [bell_maker_son.GetShortUIName] is its first victim. Future craftsmen at [founder.GetCapitalLocation.GetNameNoTooltip] will know obedience."
 ci_pam_great_projects_events.0010.d:0 "Let this be a lesson in humility."
 ci_pam_great_projects_events.0010.desc.body:0 "$ci_pam_great_projects_events.0009.desc.body$"
 ci_pam_great_projects_events.0010.desc.body.architect:0 "$ci_pam_great_projects_events.0009.desc.body.architect$"
 ci_pam_great_projects_events.0010.desc.failure_end:0 "\n\nThe molten bronze screams in the mold, but emerges complete. It is then hoisted, pulled back, but as the clapper hits the sound bow, only a dull thud is heard, followed by a crack. A herald of doom!"
 ci_pam_great_projects_events.0010.t:0 "$game_concept_grand_cathedral$: A Herald of Doom!"
 ci_pam_great_projects_events.0011.a:0 "We [founder.GetCulture.GetCollectiveNounNoTooltip] must glean what we can from the great wheel."
 ci_pam_great_projects_events.0011.a.tt:0 "Your [culture|E] gains @culture_icon!#P [EmptyScope.ScriptValue('pam_cathedral_treadwheel_fascination_progress_value')|0]#! progress towards its current [cultural_fascination|E]"
 ci_pam_great_projects_events.0011.b:0 "Many projects in [founder.GetCapitalLocation.GetNameNoTooltip] could benefit from this!"
 ci_pam_great_projects_events.0011.c:0 "Impressive, but I would leave such deeds to the Omnissiah."
 ci_pam_great_projects_events.0011.desc.architect:0 "\n\n[architect.GetFirstName] points out the giant treadwheel, with a pair of workmen walking inside."
 ci_pam_great_projects_events.0011.desc.intro:0 "Checking in on the construction progress of the [cathedral_building.GetName] of [province.GetNameNoTooltip], my ears are assaulted by the grinding squeal of a massive turning wooden structure."
 ci_pam_great_projects_events.0011.desc.no_architect:0 "\n\nI spot the source of the noise, a giant treadwheel, with a pair of workmen walking inside."
 ci_pam_great_projects_events.0011.desc.outro:0 "\n\nAs if by the hand of the Omnissiah, its ropes and pulleys hoist massive pieces of freshly cut [Glossary('ashlar','ASHLAR_GLOSS')] and buckets of mortar up to the in-progress roof. I stare in awe at the load which would have broken the backs of hodmen in the yard below."
 ci_pam_great_projects_events.0011.t:0 "$game_concept_grand_cathedral$: As If By the Omnissiah's Hand"
 ci_pam_great_projects_events.0012.a:0 ""Ordo est Pax...""
 ci_pam_great_projects_events.0012.a.flavor:0 "...order is the peace the Omnissiah gave the world. #weak (House Martyr)#!"
 ci_pam_great_projects_events.0012.a.tt:0 "Every [owner.GetFaith.GetAdjective] [county|E] in [owner.GetPrimaryTitle.GetNameNoTier] gains [GetModifier('pam_cathedral_sermon_peace_county_modifier').GetNameWithTooltip|V] for #V 10 years#!\n$pam_cathedral_sermon_peace_ai_behavior_tt$"
 ci_pam_great_projects_events.0012.b:0 ""Per Disciplina, Illuminatio...""
 ci_pam_great_projects_events.0012.b.flavor:0 "...through discipline, illumination. #weak (House Auditore)#!"
 ci_pam_great_projects_events.0012.b.tt:0 "Every [owner.GetFaith.GetAdjective] [county|E] in [owner.GetPrimaryTitle.GetNameNoTier] gains [GetModifier('pam_cathedral_sermon_diligence_county_modifier').GetNameWithTooltip|V] for #V 10 years#!\n$pam_cathedral_sermon_diligence_ai_behavior_tt$"
 ci_pam_great_projects_events.0012.c:0 ""Concordia Regit Imperium...""
 ci_pam_great_projects_events.0012.c.flavor:0 "...concord rules the Empire. #weak (House Shaokan)#!"
 ci_pam_great_projects_events.0012.c.tt:0 "Every [owner.GetFaith.GetAdjective] [county|E] in [owner.GetPrimaryTitle.GetNameNoTier] gains [GetModifier('pam_cathedral_sermon_unity_county_modifier').GetNameWithTooltip|V] for #V 10 years#!\n$pam_cathedral_sermon_unity_ai_behavior_tt$"
 ci_pam_great_projects_events.0012.d:0 ""Lux Aeterna Regnat...""
 ci_pam_great_projects_events.0012.d.flavor:0 "...the eternal light reigns. #weak (House Astrea)#!"
 ci_pam_great_projects_events.0012.d.tt:0 "Every [owner.GetFaith.GetAdjective] [county|E] in [owner.GetPrimaryTitle.GetNameNoTier] gains [GetModifier('pam_cathedral_sermon_rejoice_county_modifier').GetNameWithTooltip|V] for #V 10 years#!\n$pam_cathedral_sermon_rejoice_ai_behavior_tt$"
 ci_pam_great_projects_events.0012.desc:0 "The west face is complete! Its portal stands ready to welcome worshipers through the [Glossary('narthex','NARTHEX_GLOSS')]. The [cathedral_building.GetName] may take a lifetime to be fully finished, but the faithful of [owner.GetPrimaryTitle.GetNameNoTier] must trust in the Omnissiah's unfailing light. My sermon begins with words of the Codex Imperialis...\n\n...and I will leave with them this lesson."
 ci_pam_great_projects_events.0012.e:0 ""Virtus est Via...""
 ci_pam_great_projects_events.0012.e.flavor:0 "...virtue is the way. #weak (House Solerius)#!"
 ci_pam_great_projects_events.0012.e.tt:0 "Every [owner.GetFaith.GetAdjective] [county|E] in [owner.GetPrimaryTitle.GetNameNoTier] gains [GetModifier('pam_cathedral_sermon_perseverance_county_modifier').GetNameWithTooltip|V] for #V 10 years#!\n$pam_cathedral_sermon_perseverance_ai_behavior_tt$"
 ci_pam_great_projects_events.0012.f:0 ""Fides, Lux et Misericordia...""
 ci_pam_great_projects_events.0012.f.flavor:0 "...faith, light, and mercy. #weak (the motto of Undómiel)#!"
 ci_pam_great_projects_events.0012.f.tt:0 "Every [owner.GetFaith.GetAdjective] [county|E] in [owner.GetPrimaryTitle.GetNameNoTier] gains [GetModifier('pam_cathedral_sermon_charity_county_modifier').GetNameWithTooltip|V] for #V 10 years#!\n$pam_cathedral_sermon_charity_ai_behavior_tt$"
 ci_pam_great_projects_events.0012.t:0 "$game_concept_grand_cathedral$: His Unfailing Light"
 ci_pam_great_projects_events.0013.a:0 "Expand the loft, the more voices the better."
 ci_pam_great_projects_events.0013.b:0 "This angel must grace my court."
 ci_pam_great_projects_events.0013.c:0 "These theatrics are a ruse made to squeeze me!"
 ci_pam_great_projects_events.0013.castrato:0 "Preserve this voice for the Omnissiah's cantoria."
 ci_pam_great_projects_events.0013.castrato.tt:0 "[choir_boy.GetShortUIName|U] is castrated so [choir_boy.GetHerHis] voice does not break"
 ci_pam_great_projects_events.0013.d:0 "I am overwhelmed and must take my leave."
 ci_pam_great_projects_events.0013.desc:0 "The thunk of the carpenter's mallets echo out above us, a foretelling of the acoustics that will soon bathe worshipers in the words of the Codex.\n\n[architect.GetFirstName] explains, "It is to be a modest loft where the canons will lead the liturgy, our own [Glossary('cantoria','CANTORIA_GLOSS')]! Indeed, we must use a different voice when we address the Omnissiah than when we speak to men." [architect.GetSheHe|U] then beckons a young choir boy, [choir_boy.GetFirstName], forward.\n\nThe child scampers up the scaffold and breathes forth an angelic note; as it rings round the walls and enters my body, it is as if the Omnissiah's light has passed through me."
 ci_pam_great_projects_events.0013.t:0 "$game_concept_grand_cathedral$: A Higher Calling"
 ci_pam_great_projects_events.0020.a:0 "From near and far, come worship at our side!"
 ci_pam_great_projects_events.0020.desc:0 "At long last, the Signa Imperialis is raised upon the spires, catching the light as the Omnissiah's ray once caught the Temple Mount. It stands as a reminder of His descent among us, and a promise that His light returns to us on every holy day.\n\nSince construction began, sons became fathers, and fathers old men dead in the ground. Yet their noble toil, their sweat and blood, is immortalized in stone.\n\nEmpires may fall, but the [cathedral_building.GetName] of [province.GetName] will stand eternal as the Omnissiah's light."
 ci_pam_great_projects_events.0020.t:0 "$game_concept_grand_cathedral$: The Crowning of the Spires"

 ci_fervor_gain_cathedral_pride_sermon:0 "A sermon against pride preached at the [grand_cathedral|E] construction"
 CI_TREE_OF_SANGUINIS_GLOSS:0 "A Tree of the Sanguinis shows the divine blood descending from the Omnissiah and Undómiel through the generations, binding a reigning house to the holy line."
