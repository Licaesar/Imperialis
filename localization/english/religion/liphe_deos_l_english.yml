 imperialis:0 "Cult Imperialis"
 imperialis_adj:0 "Imperialis"
 imperialis_adherent:0 "Imperialis"
 imperialis_adherent_plural:0 "Imperiales"
 imperialis_desc:0 "There can only be one Divinus, one Imperator, one Savior. His holy bloodline is our only light in the dark; without the Sanguinis, our souls are but fodder for the ever-thirsty evils of the Daemon Princeps and his Falsi Prophetae. When mortals abandon their duty, they strip themselves of humanity, degenerating into something less than beasts. They have no place in the bosom of the Imperium, nor in the heart of the Omnissiah. Let the unworthy perish and be forever forgotten."
 
 sororitas:0 "Cult Undomiel"
 sororitas_adj:0 "Sororita"
 sororitas_adherent:0 "Sororita"
 sororitas_adherent_plural:0 "Sororitas"
 sororitas_desc:0 "The Cult Undomiel is a sisterhood of unwavering zeal, devoted to the veneration of the Sanguinis and the martyrdom of the faithful. Fighting in the memory of the sacred Undómiel, who they venerate as a Goddess, they embody divine devotion through purity, sacrifice, and holy war against all who oppose them. Their chants echo across battlefields as hymns of flame and redemption, purging the unworthy in the Holy Mother’s name."
 
 omnissiah:0 "Cult Omnissiah"
 omnissiah_adj:0 "Omnissiacus"
 omnissiah_adherent:0 "Omnissiae"
 omnissiah_adherent_plural:0 "Omnissiaes"
 omnissiah_desc:0 "The Cult Omnissiah venerates Kensoriel Liphe as the sole incarnation of the divine, the supreme God of Creation. Rejecting both the idolization of the Sanguinis and the authority of the Adeptus Ministorum, its adepts seek enlightenment strictly through understanding the sacred patterns that govern existence. To them, true faith is not inherited in blood or dictated by clerics, but earned through perfect knowledge of the Omnissiah’s grand design."

 homus:0 "Cult Harmoniae"
 homus_adj:0 "Harmonian"
 homus_adherent:0 "Harmonian"
 homus_adherent_plural:0 "Harmonians"
 homus_desc:0 "Followers of the Cultus Harmoniae believe that the Omnissiah, Kensoriel Liphe, is not a distant ruler, but the eternal balance that binds all things. Rejecting the rigid dogma of the Ministorum and the worship of mortal bloodlines, they merge His word with the esoteric wisdom of ancient prophets. Through rigorous mental discipline, meditation, and mastery of the inner self, they seek profound unity between the divine and the mortal. To them, worldly conflict is but fleeting dissonance, and an unshakeable inner peace is the truest reflection of the Omnissiah’s perfection."

