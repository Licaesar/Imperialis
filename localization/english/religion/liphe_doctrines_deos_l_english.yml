#Teachings of the Omnissiah (marco 4, fase 4c; aprovado pelo autor). O nome do grupo repete o da doutrina, como no vanilla.
 ci_doctrine_teachings_of_the_omnissiah_name:0 "Teachings of the Omnissiah"
 ci_teachings_of_the_omnissiah_name:0 "$ci_doctrine_teachings_of_the_omnissiah_name$"
 ci_doctrine_teachings_of_the_omnissiah_desc:0 "Whatever Cultus they follow, all who walk the Veritas Imperialis hold to the same teachings: that Kensoriel Liphe, the Omnissiah, walked among mortals as god made flesh; that His word endures in the Codex Imperialis; and that His blood still runs in the Sanguinis. Learning and contemplation are the paths that lead to Him, and no [head_of_faith|E] may be raised save the one seated in the Adeptus Ministorum. Yet each Cultus holds its own path to be the truest, and the faithful of one rite look askance upon the observances of another."
